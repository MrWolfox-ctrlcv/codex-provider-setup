[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-provider-setup"
# Single source of truth: codex_provider/__init__.py.  Keeping a second literal
# here let the package version and the in-app SCRIPT_VERSION drift apart.
dynamic = ["version"]
description = "Cross-platform one-shot setup/manager for arbitrary Codex model providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/MrWolfox-ctrlcv/codex-provider-setup"
Repository = "https://github.com/MrWolfox-ctrlcv/codex-provider-setup"

[project.scripts]
codex-provider-setup = "codex_provider.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codex_provider"]

[tool.hatch.version]
path = "codex_provider/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
